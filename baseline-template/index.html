<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay Todo — 基线应用</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Relay Todo</h1>
    <p class="subtitle">这是 Relay 平台的演示基线应用,由多个 AI agent 协作演进。</p>
    <form id="add-form">
      <input id="add-input" placeholder="要做点什么…" autocomplete="off" />
      <button type="submit">添加</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="stats"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
